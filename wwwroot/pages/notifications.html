<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trung Tâm Thông Báo — Lang Thang</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    .filter-tab-btn {
      padding: 8px 18px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-color);
      background: var(--bg-surface);
      color: var(--text-body);
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      transition: all var(--transition-fast);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .filter-tab-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-light);
    }
    .filter-tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }
    .noti-card-item {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 18px 22px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: all 0.2s ease;
      cursor: pointer;
      position: relative;
    }
    .noti-card-item:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: var(--primary-100);
    }
    .noti-card-item.unread {
      background: #fffdfb;
      border-left: 4px solid var(--primary);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="site-header" id="site-header-mount"></header>

  <main class="main-content" style="padding-top: 24px; padding-bottom: 60px;">
    <div class="container" style="max-width: 820px;">
      
      <!-- Breadcrumb -->
      <nav class="breadcrumb" style="margin-bottom: 16px;">
        <a href="../index.html">Trang chủ</a>
        <i class="fa-solid fa-chevron-right breadcrumb-separator" style="font-size: 0.7rem;"></i>
        <span>Thông báo</span>
      </nav>

      <!-- Header Section -->
      <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 24px; flex-wrap: wrap;">
        <div>
          <h1 style="font-size: 1.85rem; font-weight: 800; color: var(--text-main); margin: 0;">
            Thông Báo
          </h1>
        </div>
        
        <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
          <button class="btn btn-outline btn-sm" onclick="markAllNotificationsRead()">
            Đánh dấu đã đọc
          </button>
          <button class="btn btn-ghost btn-sm" style="color: var(--rose); background: var(--rose-light);" onclick="clearAllNotifications()">
            Xóa hết
          </button>
        </div>
      </div>

      <!-- Filter Tabs Bar -->
      <div style="display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; border-bottom: 1px solid var(--border-color); padding-bottom: 14px;">
        <button class="filter-tab-btn active" id="tab-all" onclick="setNotiFilter('all', this)">
          Tất cả <span id="count-all" style="font-size: 0.78rem; opacity: 0.85; margin-left: 4px; padding: 2px 6px; background: rgba(0,0,0,0.06); border-radius: 10px;">0</span>
        </button>
        <button class="filter-tab-btn" id="tab-unread" onclick="setNotiFilter('unread', this)">
          Chưa đọc <span id="count-unread" style="font-size: 0.78rem; opacity: 0.85; margin-left: 4px; padding: 2px 6px; background: rgba(0,0,0,0.06); border-radius: 10px;">0</span>
        </button>
        <button class="filter-tab-btn" id="tab-read" onclick="setNotiFilter('read', this)">
          Đã đọc <span id="count-read" style="font-size: 0.78rem; opacity: 0.85; margin-left: 4px; padding: 2px 6px; background: rgba(0,0,0,0.06); border-radius: 10px;">0</span>
        </button>
      </div>

      <!-- Notifications List Container -->
      <div id="notifications-container" style="display: flex; flex-direction: column; gap: 12px;">
        <!-- Rendered dynamically -->
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer" id="site-footer-mount"></footer>

  <!-- Scripts -->
  <script src="../js/data.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script>
    let currentFilter = 'all';

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('site-header-mount').innerHTML = UI.renderHeader('notifications');
      document.getElementById('site-footer-mount').innerHTML = UI.renderFooter();

      renderNotificationList();
    });

    function setNotiFilter(type, btn) {
      currentFilter = type;
      document.querySelectorAll('.filter-tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderNotificationList();
    }

    function renderNotificationList() {
      const notis = TravelData.getNotifications();
      
      const unreadCount = notis.filter(n => !n.isRead).length;
      const readCount = notis.filter(n => n.isRead).length;
      
      const elAll = document.getElementById('count-all');
      const elUnread = document.getElementById('count-unread');
      const elRead = document.getElementById('count-read');
      if (elAll) elAll.textContent = notis.length;
      if (elUnread) elUnread.textContent = unreadCount;
      if (elRead) elRead.textContent = readCount;

      let filtered = notis;
      if (currentFilter === 'unread') {
        filtered = notis.filter(n => !n.isRead);
      } else if (currentFilter === 'read') {
        filtered = notis.filter(n => n.isRead);
      }

      const container = document.getElementById('notifications-container');

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state" style="background: #ffffff; border: 1px solid var(--border-color); border-radius: 16px; padding: 48px 24px; text-align: center;">
            <div class="empty-state-title" style="font-size: 1.2rem; font-weight: 800; color: var(--text-main); margin-bottom: 6px;">
              ${currentFilter === 'unread' ? 'Không có thông báo chưa đọc nào' : 'Không có thông báo nào'}
            </div>
            <p class="empty-state-desc" style="color: var(--text-muted); font-size: 0.92rem; max-width: 420px; margin: 0 auto 20px;">
              Bạn đã xem hết các thông báo từ cộng đồng và hệ thống quản trị Lang Thang.
            </p>
            <a href="search.html" class="btn btn-primary btn-sm" style="display: inline-block; padding: 8px 20px;">
              Khám phá địa điểm
            </a>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(n => `
        <div class="noti-card-item ${n.isRead ? '' : 'unread'}" onclick="handleNotiClick(${n.id})">
          <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px;">
            <div style="display: flex; align-items: center; gap: 8px;">
              <h3 style="font-size: 0.96rem; font-weight: 800; color: var(--text-main); margin: 0;">${n.title}</h3>
              ${!n.isRead ? '<span class="unread-badge-pill" style="font-size:0.7rem; padding:1px 6px;">Mới</span>' : ''}
            </div>
            <span style="font-size: 0.78rem; color: var(--text-muted); white-space: nowrap;">${n.time}</span>
          </div>
          
          <p style="font-size: 0.9rem; color: var(--text-body); line-height: 1.5; margin: 0;">${n.content}</p>
          
          <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--border-subtle);">
            ${n.targetUrl ? `
              <a href="${n.targetUrl}" class="btn btn-outline btn-sm" style="font-size: 0.8rem; padding: 3px 12px;" onclick="event.stopPropagation(); TravelData.markNotificationRead(${n.id});">
                Xem chi tiết
              </a>
            ` : '<span></span>'}
            
            <div style="display: flex; gap: 6px;" onclick="event.stopPropagation();">
              <button class="btn btn-ghost btn-sm" style="font-size: 0.78rem; color: var(--text-muted);" onclick="toggleReadStatus(${n.id})">
                ${n.isRead ? 'Đánh dấu chưa đọc' : 'Đã đọc'}
              </button>
              <button class="btn btn-ghost btn-sm" style="font-size: 0.78rem; color: var(--rose);" onclick="deleteNotification(${n.id})">
                Xóa
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function handleNotiClick(id) {
      const notis = TravelData.getNotifications();
      const n = notis.find(item => item.id === parseInt(id));
      TravelData.markNotificationRead(id);
      renderNotificationList();
      UI.updateNotificationBadge();

      if (n && n.targetUrl) {
        window.location.href = n.targetUrl;
      }
    }

    function toggleReadStatus(id) {
      const notis = TravelData.getNotifications();
      const n = notis.find(item => item.id === parseInt(id));
      if (n) {
        n.isRead = !n.isRead;
        localStorage.setItem('tr_notifications', JSON.stringify(notis));
        renderNotificationList();
        UI.updateNotificationBadge();
        UI.showToast(n.isRead ? 'Đã đánh dấu đã đọc' : 'Đã đánh dấu chưa đọc', 'info');
      }
    }

    function deleteNotification(id) {
      TravelData.deleteNotification(id);
      renderNotificationList();
      UI.updateNotificationBadge();
      UI.showToast('Đã xóa thông báo', 'info');
    }

    function markAllNotificationsRead() {
      TravelData.markAllNotificationsRead();
      renderNotificationList();
      UI.updateNotificationBadge();
      UI.showToast('Đã đánh dấu tất cả là đã đọc', 'success');
    }

    function clearAllNotifications() {
      if (confirm('Bạn có chắc chắn muốn xóa toàn bộ thông báo?')) {
        TravelData.clearNotifications();
        renderNotificationList();
        UI.updateNotificationBadge();
        UI.showToast('Đã xóa toàn bộ thông báo', 'info');
      }
    }
  </script>
</body>
</html>
