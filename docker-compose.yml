services:
  # ----------------------------------------------------
  # 1. SQL SERVER 2022 DATABASE
  # ----------------------------------------------------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: minimap_sqlserver
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Passw0rd
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Passw0rd' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ----------------------------------------------------
  # 2. TRAVEL REVIEW ASP.NET CORE WEB APP
  # ----------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: minimap_web
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=TravelReviewDB_v2;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;MultipleActiveResultSets=true
    ports:
      - "5192:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  mssql_data:
    driver: local
