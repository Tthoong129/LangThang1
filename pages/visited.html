<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nhật Ký Đã Ghé Thăm — Lang Thang</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <!-- Header -->
  <header class="site-header" id="site-header-mount"></header>

  <main class="main-content">
    <div class="container" style="max-width: 920px;">
      
      <!-- Breadcrumb -->
      <nav class="breadcrumb" style="display:flex; align-items:center; gap:8px; font-size:0.85rem; color:var(--text-muted); margin-bottom:16px;">
        <a href="../index.html">Trang chủ</a> <i class="fa-solid fa-chevron-right" style="font-size:0.65rem;"></i>
        <span>Nhật ký địa điểm đã ghé thăm</span>
      </nav>

      <!-- Section Title -->
      <div style="margin-bottom: 24px;">
        <h1 style="font-size: 1.8rem; font-weight: 800; color: var(--text-main); margin: 0;"><i class="fa-solid fa-calendar-check" style="color: var(--accent);"></i> Nhật Ký Chuyến Đi</h1>
      </div>

      <!-- Visited Timeline List -->
      <div id="visited-timeline-container" style="display: flex; flex-direction: column; gap: 16px;">
        <!-- Rendered dynamically -->
      </div>

    </div>
  </main>

  <!-- Mobile Bottom Nav -->
  <nav class="mobile-bottom-nav">
    <a href="../index.html" class="mobile-bottom-nav-item"><i class="fa-solid fa-house"></i> Trang chủ</a>
    <a href="search.html" class="mobile-bottom-nav-item"><i class="fa-solid fa-compass"></i> Khám phá</a>
    <a href="map.html" class="mobile-bottom-nav-item"><i class="fa-solid fa-map-location-dot"></i> Bản đồ</a>
    <a href="favorites.html" class="mobile-bottom-nav-item"><i class="fa-solid fa-heart"></i> Yêu thích</a>
    <a href="profile.html" class="mobile-bottom-nav-item"><i class="fa-solid fa-user"></i> Cá nhân</a>
  </nav>

  <!-- Footer -->
  <footer class="site-footer" id="site-footer-mount"></footer>

  <!-- Scripts -->
  <script src="../js/data.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('site-header-mount').innerHTML = UI.renderHeader('visited');
      document.getElementById('site-footer-mount').innerHTML = UI.renderFooter();

      renderVisitedLogs();
    });

    async function renderVisitedLogs() {
      let logs = [];
      try {
        if (typeof api !== 'undefined') {
          const user = api.getCurrentUser();
          if (user) {
            const res = await fetch(`/api/User/visited?userId=${user.id}`);
            if (res.ok) logs = await res.json();
          }
        }
      } catch(e) {}

      if (!logs || logs.length === 0) {
        if (typeof TravelData !== 'undefined') {
          logs = TravelData.getVisitLogs();
        }
      }

      const container = document.getElementById('visited-timeline-container');
      if (!container) return;

      if (!logs || logs.length === 0) {
        container.innerHTML = `
          <div style="text-align:center; padding:48px 20px; background:#ffffff; border-radius:var(--radius-xl); border:1px solid var(--border-color);">
            <i class="fa-regular fa-calendar-check" style="font-size:3rem; color:var(--accent); margin-bottom:14px; opacity:0.8;"></i>
            <div style="font-weight:800; font-size:1.25rem; margin-bottom:6px;">Nhật ký chuyến đi đang trống</div>
            <p style="color:var(--text-muted); font-size:0.92rem; margin-bottom:20px;">Khi xem một địa điểm bất kỳ, bấm "Đã ghé thăm" để lưu lại ngày bạn trải nghiệm.</p>
            <a href="search.html" class="btn btn-primary">Khám phá địa điểm</a>
          </div>
        `;
        return;
      }

      container.innerHTML = logs.map(l => {
        const place = l.place || (typeof TravelData !== 'undefined' ? TravelData.getPlaceById(l.placeId) : null);
        if (!place) return '';

        const thumb = place.thumbnailUrl || (place.images && place.images[0]) || 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=200';
        const dateStr = l.visitedDate || (l.visitDate ? new Date(l.visitDate).toLocaleDateString('vi-VN') : 'Gần đây');

        return `
          <div style="background:#ffffff; border:1px solid var(--border-color); border-radius:var(--radius-xl); padding:18px 24px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; box-shadow:var(--shadow-xs);">
            <div style="display:flex; align-items:center; gap:16px;">
              <img src="${thumb}" style="width:74px; height:74px; border-radius:var(--radius-lg); object-fit:cover;" alt="${place.name}" />
              <div>
                <a href="place-detail.html?id=${place.id}" style="font-weight:800; font-size:1.1rem; color:var(--text-main);">${place.name}</a>
                <div style="font-size:0.82rem; color:var(--text-muted); margin-top:3px;"><i class="fa-solid fa-location-dot" style="color:var(--primary);"></i> ${place.address || place.provinceName || 'Việt Nam'}</div>
                <div style="margin-top:6px; display:flex; align-items:center; gap:10px;">
                  <span style="font-size:0.82rem; font-weight:700; color:var(--accent);">
                    <i class="fa-solid fa-calendar-day"></i> Ngày ghé: ${dateStr}
                  </span>
                  <span class="badge ${l.privacy === 'public' ? 'badge-privacy-public' : 'badge-category'}">
                    ${l.privacy === 'public' ? '<i class="fa-solid fa-globe"></i> Công khai' : '<i class="fa-solid fa-lock"></i> Chỉ mình tôi'}
                  </span>
                </div>
              </div>
            </div>

            <a href="place-detail.html?id=${place.id}" class="btn btn-outline btn-sm">Xem lại địa điểm</a>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
