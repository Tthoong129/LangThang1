<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Địa Điểm Đã Lưu Yêu Thích — Lang Thang</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <!-- Header -->
  <header class="site-header" id="site-header-mount"></header>

  <main class="main-content">
    <div class="container">
      
      <!-- Breadcrumb -->
      <nav class="breadcrumb" style="display:flex; align-items:center; gap:8px; font-size:0.85rem; color:var(--text-muted); margin-bottom:16px;">
        <a href="../index.html">Trang chủ</a> <i class="fa-solid fa-chevron-right" style="font-size:0.65rem;"></i>
        <span>Danh sách địa điểm yêu thích</span>
      </nav>

      <!-- Section Title & Filter -->
      <div style="display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 28px; flex-wrap: wrap; gap: 16px;">
        <div>
          <h1 style="font-size: 1.8rem; font-weight: 800; color: var(--text-main); margin: 0;"><i class="fa-solid fa-heart" style="color: var(--rose);"></i> Địa Điểm Yêu Thích</h1>
        </div>

        <div style="display: flex; gap: 10px;">
          <select id="fav-type-filter" class="form-control" style="width: auto; height: 40px;" onchange="renderFavorites()">
            <option value="">Tất cả loại hình</option>
            <option value="1">Ăn uống & Cà phê</option>
            <option value="2">Danh lam & Du lịch</option>
            <option value="3">Khách sạn & Lưu trú</option>
            <option value="4">Vui chơi & Trải nghiệm</option>
          </select>
        </div>
      </div>

      <!-- Favorites Grid -->
      <div class="place-grid" id="favorites-grid">
        <!-- Rendered dynamically -->
      </div>

    </div>
  </main>

  <!-- Mobile Bottom Nav -->
  <nav class="mobile-bottom-nav">
    <a href="../index.html" class="mobile-bottom-nav-item"><i class="fa-solid fa-house"></i> Trang chủ</a>
    <a href="search.html" class="mobile-bottom-nav-item"><i class="fa-solid fa-compass"></i> Khám phá</a>
    <a href="map.html" class="mobile-bottom-nav-item"><i class="fa-solid fa-map-location-dot"></i> Bản đồ</a>
    <a href="favorites.html" class="mobile-bottom-nav-item active"><i class="fa-solid fa-heart"></i> Yêu thích</a>
    <a href="profile.html" class="mobile-bottom-nav-item"><i class="fa-solid fa-user"></i> Cá nhân</a>
  </nav>

  <!-- Footer -->
  <footer class="site-footer" id="site-footer-mount"></footer>

  <!-- Scripts -->
  <script src="../js/data.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('site-header-mount').innerHTML = UI.renderHeader('favorites');
      document.getElementById('site-footer-mount').innerHTML = UI.renderFooter();

      renderFavorites();
    });

    async function renderFavorites() {
      const typeId = document.getElementById('fav-type-filter')?.value;
      let places = [];

      try {
        if (typeof api !== 'undefined') {
          const user = api.getCurrentUser();
          if (user) {
            const favRes = await fetch(`/api/User/favorites?userId=${user.id}`);
            if (favRes.ok) places = await favRes.json();
          }
        }
      } catch (e) {}

      if (!places || places.length === 0) {
        if (typeof TravelData !== 'undefined') {
          const favIds = TravelData.getFavorites();
          places = favIds.map(id => TravelData.getPlaceById(id)).filter(p => p !== undefined);
        }
      }

      if (typeId) {
        places = places.filter(p => (p.placeTypeId || p.category?.placeTypeId || 1) === parseInt(typeId));
      }

      const container = document.getElementById('favorites-grid');
      if (!container) return;

      if (places.length === 0) {
        container.innerHTML = `
          <div style="grid-column:1/-1; text-align:center; padding:48px 20px; background:#ffffff; border-radius:var(--radius-xl); border:1px solid var(--border-color);">
            <i class="fa-regular fa-heart" style="font-size:3rem; color:var(--rose); margin-bottom:14px; opacity:0.8;"></i>
            <div style="font-weight:800; font-size:1.25rem; margin-bottom:6px;">Chưa có địa điểm yêu thích nào</div>
            <p style="color:var(--text-muted); font-size:0.92rem; margin-bottom:20px;">Hãy khám phá các địa điểm hấp dẫn và bấm biểu tượng trái tim để lưu lại.</p>
            <a href="search.html" class="btn btn-primary">Khám phá địa điểm ngay</a>
          </div>
        `;
        return;
      }

      container.innerHTML = places.map(p => UI.createPlaceCard(p)).join('');
    }
  </script>
</body>
</html>
