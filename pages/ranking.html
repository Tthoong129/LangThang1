<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travelers' Choice Awards & Bảng Xếp Hạng — TripAdvisor Lang Thang</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">

  <style>
    .ranking-hero-banner {
      background: linear-gradient(135deg, #004f32 0%, #002b1b 100%);
      border-radius: var(--radius-xl);
      padding: 40px 32px;
      color: #ffffff;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      box-shadow: var(--shadow-lg);
    }
    .rank-card-row {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 18px 24px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 20px;
      transition: all var(--transition-fast);
      box-shadow: var(--shadow-xs);
    }
    .rank-card-row:hover {
      border-color: var(--primary);
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }
    .rank-medal-box {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      font-weight: 800;
      flex-shrink: 0;
    }
    .rank-1 { background: #fef08a; color: #854d0e; border: 2px solid #fde047; }
    .rank-2 { background: #e2e8f0; color: #475569; border: 2px solid #cbd5e1; }
    .rank-3 { background: #ffedd5; color: #9a3412; border: 2px solid #fdba74; }
    .rank-other { background: var(--bg-subtle); color: var(--text-muted); font-size: 0.95rem; }
    .rank-thumb {
      width: 100px;
      height: 80px;
      border-radius: var(--radius-md);
      object-fit: cover;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="site-header" id="site-header-mount"></header>

  <main class="main-content">
    <div class="container" style="max-width: 1000px;">
      
      <!-- Breadcrumb -->
      <nav class="breadcrumb" style="display:flex; align-items:center; gap:8px; font-size:0.85rem; color:var(--text-muted); margin-bottom:16px;">
        <a href="../index.html">Trang chủ</a> <i class="fa-solid fa-chevron-right" style="font-size:0.65rem;"></i>
        <span style="color: var(--text-main); font-weight: 700;">Travelers' Choice Awards</span>
      </nav>

      <!-- Banner -->
      <div class="ranking-hero-banner" style="padding: 28px 24px;">
        <div>
          <h1 style="font-size: 1.8rem; font-weight: 800; color: #ffffff; line-height: 1.2; margin: 0;">
            Bảng Xếp Hạng Địa Điểm Nổi Bật
          </h1>
        </div>
      </div>

      <!-- Filters Bar -->
      <div style="background: #ffffff; border: 1px solid var(--border-color); border-radius: var(--radius-xl); padding: 18px 24px; margin-bottom: 24px; display: flex; gap: 16px; flex-wrap: wrap; align-items: center; justify-content: space-between; box-shadow: var(--shadow-sm);">
        <div style="display: flex; gap: 12px; flex-wrap: wrap;">
          <select id="rank-type-select" class="form-control" style="width: auto; font-size: 0.88rem; font-weight: 700;" onchange="renderRankingList()">
            <option value="">Tất cả Loại hình</option>
            <option value="1">Ẩm thực & Quán ăn</option>
            <option value="2">Điểm tham quan & Du lịch</option>
            <option value="3">Khách sạn & Lưu trú</option>
            <option value="4">Vui chơi & Giải trí</option>
          </select>

          <select id="rank-region-select" class="form-control" style="width: auto; font-size: 0.88rem; font-weight: 700;" onchange="renderRankingList()">
            <option value="">Toàn quốc (3 Miền)</option>
            <option value="1">Miền Bắc</option>
            <option value="2">Miền Trung</option>
            <option value="3">Miền Nam (TP. Hồ Chí Minh)</option>
          </select>
        </div>

        <span style="font-size: 0.85rem; font-weight: 700; color: var(--text-muted);">
          Cập nhật mùa du lịch 2026
        </span>
      </div>

      <!-- Ranking Cards Container -->
      <div id="ranking-cards-container">
        <!-- Rendered dynamically -->
      </div>

    </div>
  </main>

  <!-- 3. FOOTER -->
  <footer class="site-footer" id="site-footer-mount"></footer>

  <!-- Scripts -->
  <script src="../js/data.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('site-header-mount').innerHTML = UI.renderHeader('ranking');
      document.getElementById('site-footer-mount').innerHTML = UI.renderFooter();
      renderRankingList();
    });

    async function renderRankingList() {
      const typeId = document.getElementById('rank-type-select')?.value;
      const regionId = document.getElementById('rank-region-select')?.value;

      let places = [];
      try {
        if (typeof api !== 'undefined') places = await api.getPlaces();
      } catch(e) {}

      if (!places || places.length === 0) {
        if (typeof TravelData !== 'undefined') places = TravelData.getPlaces();
      }

      if (typeId) {
        places = places.filter(p => (p.placeTypeId || p.category?.placeTypeId || 1) === parseInt(typeId));
      }

      if (regionId && typeof TravelData !== 'undefined') {
        const provsInRegion = TravelData.getProvinces().filter(pr => pr.regionId === parseInt(regionId)).map(pr => pr.id);
        places = places.filter(p => provsInRegion.includes(p.provinceId));
      }

      places.sort((a, b) => {
        const scoreA = (Number(a.avgRating) || 4.5) * 100 + (a.reviewCount || 0);
        const scoreB = (Number(b.avgRating) || 4.5) * 100 + (b.reviewCount || 0);
        return scoreB - scoreA;
      });

      const container = document.getElementById('ranking-cards-container');
      if (!container) return;

      if (places.length === 0) {
        container.innerHTML = `
          <div style="text-align:center; padding:40px; background:#ffffff; border-radius:var(--radius-xl); border:1px solid var(--border-color);">
            <i class="fa-solid fa-trophy" style="font-size:2.5rem; color:var(--text-muted); margin-bottom:12px;"></i>
            <h3 style="font-weight:800;">Chưa có dữ liệu bảng xếp hạng</h3>
          </div>
        `;
        return;
      }

      container.innerHTML = places.map((p, idx) => {
        let medalHtml = `<div class="rank-medal-box rank-other">#${idx + 1}</div>`;
        if (idx === 0) medalHtml = `<div class="rank-medal-box rank-1">🥇</div>`;
        else if (idx === 1) medalHtml = `<div class="rank-medal-box rank-2">🥈</div>`;
        else if (idx === 2) medalHtml = `<div class="rank-medal-box rank-3">🥉</div>`;

        const thumb = p.thumbnailUrl || (p.images && p.images[0]) || 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=300';
        const catName = p.category?.name || p.categoryName || p.category || 'Địa điểm';
        const provName = p.province?.name || p.provinceName || 'Việt Nam';
        const rating = Number(p.avgRating) || 4.8;
        const reviewCount = p.reviewCount || 120;

        return `
          <div class="rank-card-row">
            ${medalHtml}
            <img src="${thumb}" class="rank-thumb" alt="${p.name}" loading="lazy" />
            <div style="flex:1; min-width:0;">
              <div style="display:flex; align-items:center; gap:8px; margin-bottom:4px; flex-wrap:wrap;">
                <span class="badge badge-travelers-choice"><i class="fa-solid fa-award"></i> Travelers' Choice</span>
                <span style="font-size:0.8rem; color:var(--text-muted);">${catName} • ${provName}</span>
              </div>
              <a href="place-detail.html?id=${p.id}" style="font-size:1.15rem; font-weight:800; color:var(--text-main); display:block; margin-bottom:6px;">${p.name}</a>
              ${UI.renderBubbleRating(rating, reviewCount, true)}
            </div>
            <a href="place-detail.html?id=${p.id}" class="btn btn-outline btn-sm" style="flex-shrink:0;">
              Khám phá <i class="fa-solid fa-arrow-right"></i>
            </a>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
